name: Zenodo snapshot

# Monthly, 12:40 UTC on the 3rd: archive the current Hugging Face files on Zenodo as a new version under one
# concept DOI (src/zenodo_upload.py). Skips with a notice, and does not fail, while the ZENODO_TOKEN secret is
# unset. The repository variable ZENODO_API picks the server: unset means production (https://zenodo.org/api);
# set it to https://sandbox.zenodo.org/api to test. Set the variable ZENODO_PUBLISH to false to leave an
# unpublished draft instead of publishing. Setup steps are in the README, "Zenodo archive".

on:
  schedule:
    - cron: "40 12 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenodo
  cancel-in-progress: false

jobs:
  zenodo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      ZENODO_API: ${{ vars.ZENODO_API }}
      ZENODO_PUBLISH: ${{ vars.ZENODO_PUBLISH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Upload a new version to Zenodo
        run: python src/zenodo_upload.py
